name: Release

# Triggered by `npm run cut:*`, which bumps the version and pushes a vX.Y.Z tag.
# Installers are published to a separate public repo so the app can check for
# updates without a token; this source repo stays private.
on:
  push:
    tags: ["v*"]

env:
  RELEASES_REPO: johncfp/transcriptor2-releases

jobs:
  # Create the draft release exactly once, before the platform builds start.
  # When each build job created its own, two jobs could make separate drafts
  # for the same tag and one platform's files ended up stranded (v1, v0.9.5).
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
          else
            prerelease=""
            [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease="--prerelease"
            gh release create "$GITHUB_REF_NAME" --repo "$RELEASES_REPO" --draft $prerelease \
              --title "Transcriptor 2 ${GITHUB_REF_NAME#v}" --notes "" --target main
          fi

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Uploads into the draft created above (matched by tag).
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          # No Apple or Windows signing certificates are configured, so build unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          gh release edit "$GITHUB_REF_NAME" --repo "$RELEASES_REPO" --draft=false
          echo "Assets on the published release:"
          gh release view "$GITHUB_REF_NAME" --repo "$RELEASES_REPO" --json assets --jq '.assets[].name'
